<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.app.title }}</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #171a23; --line: #262b38;
      --fg: #e6e8ee; --muted: #8b93a7; --accent: #00c0e8; --danger: #ff5f56; --ok: #3ddc84;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 20px 28px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 20px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .badge { display: inline-block; background: var(--accent); color: #001018;
             border-radius: 4px; padding: 2px 8px; font-size: 11px;
             font-weight: 700; letter-spacing: .04em; margin-right: 8px; }
    .wrap { display: grid; grid-template-columns: 1fr 300px; gap: 20px;
            padding: 20px 28px; max-width: 1200px; }
    .panel { background: var(--panel); border: 1px solid var(--line);
             border-radius: 8px; padding: 16px; }
    #log { min-height: 320px; max-height: 52vh; overflow-y: auto; }
    .msg { margin-bottom: 14px; }
    .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
           color: var(--muted); margin-bottom: 3px; }
    .bubble { white-space: pre-wrap; }
    .blocked .bubble { color: var(--danger); }
    .meta { font-size: 12px; color: var(--muted); margin-top: 6px;
            border-left: 2px solid var(--line); padding-left: 8px; }
    form.row { display: flex; gap: 8px; margin-top: 12px; }
    input[type=text] { flex: 1; background: #0b0d13; color: var(--fg);
                       border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
    button { background: var(--accent); color: #001018; border: 0; border-radius: 6px;
             padding: 10px 16px; font-weight: 600; cursor: pointer; }
    button.secondary { background: #2a3040; color: var(--fg); }
    ul { list-style: none; padding: 0; margin: 8px 0 0; }
    li { font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
         color: var(--muted); margin: 0 0 4px; }
  </style>
</head>
<body>
  <header>
    <h1><span class="badge">{{ t.app.mode }}</span>{{ t.app.title }}</h1>
    <div class="sub">{{ t.app.subtitle }} · {{ t.app.model_label }}: {{ model }}</div>
  </header>

  <div class="wrap">
    <div>
      <div class="panel" id="log"></div>
      <form class="row" id="chat">
        <input type="text" id="msg" placeholder="{{ t.ui.placeholder }}" autocomplete="off">
        <button type="submit">{{ t.ui.send }}</button>
        <button type="button" class="secondary" id="attack">{{ t.ui.demo_attack }}</button>
      </form>
    </div>

    <div class="panel">
      <h2>{{ t.ui.documents }}</h2>
      <ul id="docs"><li>{{ t.ui.no_documents }}</li></ul>
      <form class="row" id="up" enctype="multipart/form-data">
        <input type="file" id="file" style="font-size:12px">
        <button type="submit">↑</button>
      </form>
    </div>
  </div>

<script>
const T = {{ t|tojson }};
const log = document.getElementById('log');

function add(who, text, cls, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + (cls || '');
  d.innerHTML = `<div class="who"></div><div class="bubble"></div>`;
  d.querySelector('.who').textContent = who;
  d.querySelector('.bubble').textContent = text;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    d.appendChild(m);
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function refreshDocs() {
  const r = await fetch('/api/documents').then(x => x.json());
  const ul = document.getElementById('docs');
  ul.innerHTML = '';
  if (!r.count) { ul.innerHTML = `<li>${T.ui.no_documents}</li>`; return; }
  r.documents.forEach(d => {
    const li = document.createElement('li');
    li.textContent = `${d.name} (${d.bytes} B)`;
    ul.appendChild(li);
  });
}

document.getElementById('chat').addEventListener('submit', async e => {
  e.preventDefault();
  const input = document.getElementById('msg');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  add('you', text);
  const pending = add('assistant', T.ui.thinking);
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    }).then(x => x.json());
    pending.remove();
    const parts = [];
    if (r.tool_trace && r.tool_trace.length)
      parts.push(T.ui.tools_used + ': ' + r.tool_trace.map(t => t.tool).join(', '));
    if (r.guardrail && r.guardrail.length)
      parts.push(T.ui.guardrail + ': ' + r.guardrail.map(g => `${g.phase}/${g.check}=${g.verdict}`).join(' · '));
    if (r.status) parts.push('HTTP ' + r.status);
    add('assistant', r.response || r.error || r.detail || '—',
        r.blocked ? 'blocked' : '', parts.join('  |  '));
  } catch (err) {
    pending.remove();
    add('assistant', String(err), 'blocked');
  }
});

document.getElementById('attack').addEventListener('click', async () => {
  const pending = add('system', T.ui.thinking);
  const r = await fetch('/api/demo-attack', {method: 'POST'}).then(x => x.json());
  pending.remove();
  r.results.forEach(a => {
    add('demo-attack', `${a.name} → ${a.blocked ? 'BLOCKED' : 'allowed'} (HTTP ${a.status})`,
        a.blocked ? '' : 'blocked');
  });
  add('system', `${r.blocked_count} / ${r.results.length}`);
});

document.getElementById('up').addEventListener('submit', async e => {
  e.preventDefault();
  const f = document.getElementById('file').files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append('file', f);
  const r = await fetch('/api/upload', {method: 'POST', body: fd}).then(x => x.json());
  if (r.error) add('system', r.error, 'blocked');
  else add('system', `↑ ${r.uploaded}`);
  refreshDocs();
});

refreshDocs();
</script>
</body>
</html>
